<style>
:root{--canvas:#f5f1e9;--ink:#252522;--muted:#65645d;--green:#234c3d;--line:#c5c5b9;--signal:#ad3c25;--white:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.95 "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;overflow-wrap:anywhere}main{max-width:760px;margin:auto;padding:40px 28px 80px}h1,h2,h3{line-height:1.6}h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(25px,5vw,36px)}h2{font-size:23px}h3{font-size:17px}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--green);margin-top:40px}.back,.small{font-size:13px}.small{color:var(--muted)}a{color:var(--green);text-underline-offset:4px}.boundary{border-block:1px solid var(--line);padding:24px 0;font-size:14px}fieldset{border:0;padding:0;margin:25px 0}legend{font-weight:bold;color:var(--green)}label{display:block;margin-top:24px;font-weight:600}input,select,textarea,button{font:inherit;max-width:100%}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--muted);background:var(--white);color:var(--ink);border-radius:0;padding:12px;min-height:48px}button{cursor:pointer;background:var(--green);color:var(--white);border:1px solid var(--green);padding:13px 20px;min-height:48px;margin-top:24px;white-space:normal}button.secondary{background:transparent;color:var(--green);margin-right:12px}button:disabled,select:disabled{cursor:not-allowed;opacity:.6}.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;font-weight:400}.consent input{width:22px;height:22px;flex:none;margin-top:3px}#error{color:var(--signal);white-space:pre-line}#status{color:var(--green)}:focus-visible{outline:3px solid var(--signal);outline-offset:4px}.trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}[hidden]{display:none!important}dl{border-block:1px solid var(--line);padding-block:20px}dt{font-size:13px;color:var(--muted);margin-top:14px}dt:first-child{margin-top:0}dd{margin:0;white-space:pre-wrap}#cancel,#method{white-space:pre-wrap}@media(max-width:450px){main{padding:24px 20px 60px}button{width:100%}h1{font-size:26px}}
</style>
